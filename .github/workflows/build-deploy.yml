name: Build and deploy story

# main     -> build and publish on GitHub Pages
# entwurf  -> build a preview (only if the secret PREVIEW_TOKEN is set; see README)
# daily    -> rebuild main with fresh data
on:
  push:
    branches: [main, entwurf]
  schedule:
    - cron: "17 6 * * *"     # daily, ~07:17/08:17 Swiss time (after the BFE update)
  workflow_dispatch:

permissions:
  contents: write            # commit the refreshed data snapshot
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}     # optional: API keys for own data sources
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4                  # formats the citations (tools/cite.mjs)
        with:
          node-version: 20

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2   # reads DESCRIPTION

      - name: Build site
        run: Rscript build.R

      - name: Save data snapshot (fallback for the next build)
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || git commit -m "Update data snapshot"
          git push || echo "snapshot not pushed"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'main'
        with:
          path: _site

      - name: Publish preview (branch entwurf -> repository <name>-vorschau)
        if: github.ref_name == 'entwurf' && env.PREVIEW_TOKEN != ''
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Vorschau ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${PREVIEW_TOKEN}@github.com/${GITHUB_REPOSITORY}-vorschau.git" gh-pages
          echo "Vorschau: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}-vorschau/" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
